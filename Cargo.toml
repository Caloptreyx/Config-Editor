[package]
name = "dev_caloptreyx_configeditor"
description = "Edit YAML, JSON, TOML, properties, .env and INI server configs through generated forms that keep comments and layout intact."
authors = ["Caloptreyx"]
version = "0.1.0"
edition = { workspace = true }

[dependencies]
shared = { workspace = true }
wings-api = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true, features = ["macros"] }
uuid = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
saphyr-parser = "0.1.0"
toml_edit = "0.25.15"
