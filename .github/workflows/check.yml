# Builds this extension inside a real Calagopus panel checkout on every push.
# The steps live in Caloptreyx/.github (.github/workflows/extension-check.yml).
name: Check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # A branch in this repo is already checked by its push; pull requests only add forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: Caloptreyx/.github/.github/workflows/extension-check.yml@main

  # The VS Code workbench (workbench/) is its own Vite app; the shared check does not build it.
  workbench:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check the build output
        run: test -f ../frontend/public/config-editor-vscode/index.html
